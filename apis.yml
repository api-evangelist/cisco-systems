description: >-
  Cisco Systems is a global technology company providing networking, security, collaboration, and cloud infrastructure
  products. Cisco exposes its programmable surface through Cisco DevNet, a single developer portal that aggregates
  documentation, sandboxes, code exchange, and learning labs across the company's hardware and software portfolio. Major
  API domains include Catalyst Center and Meraki for network management, IOS XE RESTCONF for device-level
  programmability, Webex for collaboration, Secure Firewall and ISE for security, ThousandEyes and AppDynamics for
  observability, and Intersight for cloud-managed infrastructure. Authentication models vary by product line and include
  OAuth 2.0, API keys, basic-auth token exchange, and HTTP signature authentication.
